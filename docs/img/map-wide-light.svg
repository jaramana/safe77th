<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img"><title>Where 77th Street sits</title><desc>An aerial photo of Bay Ridge with 77th Street circled, and the Verrazzano-Narrows Bridge to the southwest.</desc><circle cx="801" cy="535" r="54" fill="none" stroke="#ffffff" stroke-width="9"/><circle cx="801" cy="535" r="54" fill="none" stroke="#006b3f" stroke-width="5"/><path d="M770,511 L831,559" stroke="#006b3f" stroke-width="9" stroke-linecap="round"/><text x="864.5" y="547.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#0e2f22" stroke="#ffffff" stroke-width="10.6" paint-order="stroke" stroke-linejoin="round" text-anchor="start">Our two blocks</text><text x="417.8" y="874.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#0e2f22" stroke="#ffffff" stroke-width="7.8" paint-order="stroke" stroke-linejoin="round" text-anchor="start">Verrazzano-Narrows Bridge</text></svg>
